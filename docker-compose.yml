services:
  #   docker compose --profile dev up --build
  app-dev:
    profiles: ['dev']
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - /app/node_modules

  #   docker compose --profile prod up --build -d
  app-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    ports:
      - '3000:3000'
    restart: unless-stopped
